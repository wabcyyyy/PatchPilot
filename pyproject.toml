[project]
name = "patchpilot"
version = "0.1.0"
description = "PatchPilot:面向软件仓库的测试失败诊断与补丁验证平台"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# 依赖以本文件为唯一声明源;requirements.txt / requirements-dev.txt 是 CI 与镜像的安装入口
# (CI:python -m pip install -r requirements.txt -r requirements-dev.txt),
# 两侧一致性由 tests/test_docs_anchors.py::test_requirements_files_match_pyproject 卡住。
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "pyyaml>=6.0",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "redis>=5.0",
]

[project.optional-dependencies]
llm = ["openai>=1.40"]
# httpx 不是运行期依赖,是 starlette TestClient 需要的测试客户端
dev = ["pytest>=8.2", "ruff>=0.5", "httpx>=0.27"]

[tool.ruff]
line-length = 100
target-version = "py311"
# bugs/ 是生成物、runs/ 是产物目录,不参与 lint(R2 整改)
extend-exclude = ["bugs", "runs", ".pytest-tmp"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RET", "SIM", "C4", "PERF", "RUF"]
ignore = [
    "E501", # 行长由 format 管理,长字符串(生成器/提示词)不强行折行
    "RUF001", "RUF002", "RUF003", # 中文文案中的全角标点误报
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# 不在此处钉 --basetemp:落点在仓库内会让"临时目录的父链上有本仓库 .git"这类夹具缺陷
# 悄悄变绿(防线见 tests/conftest.py 的 _basetemp_outside_repo),而仓库外落点没法写进
# 共享配置。本机 %TEMP%\pytest-of-* 的 ACL 是坏的(PM-004),本地跑要显式传:
#   pytest -q --basetemp=D:/tmp/pt
# CI 用系统临时目录,直接 pytest -q 即可。
addopts = "-ra"
# 分档(登记表见 tests/slow_tests.txt,跑法见 AGENTS.md「提交规范」):
#   快档   pytest -q -m "not slow" --basetemp=D:/tmp/pt        —— 需要广泛快回归时的 L2 补充
#   本地全量 pytest -q -m "not stress" --basetemp=D:/tmp/pt    —— 用户明确要求的本地全量；日常全集交 CI
#   CI     pytest -q                                          —— 全集(含 stress),最终闸
markers = [
    "slow: 单条 >=2s 的端到端用例(由 tests/slow_tests.txt 登记,conftest 自动打标)",
    "stress: 压力/并发冒烟,只在 CI 全集里跑(同时也是 slow)",
]
