name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Build executor test image (tests/test_docker.py 用)
        run: docker build -t patchpilot-executor:latest docker/
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest -q
      - name: Smoke eval (replay, BUG-001..003)
        run: |
          python scripts/gen_bugs.py BUG-001 BUG-002 BUG-003
          for b in BUG-001 BUG-002 BUG-003; do
            python -m app.evals.run_single --bug "$b" --model fake --engine graph --out runs/ci || exit 1
          done
      - name: Upload eval artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eval-runs
          path: |
            runs/ci/**/report.json
            runs/ci/**/trajectory.jsonl
          if-no-files-found: error
