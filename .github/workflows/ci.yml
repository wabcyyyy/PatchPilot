name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # 固定镜像版本:ubuntu-latest 自 2026-10-19 起迁到 Ubuntu 26,docker 用例对宿主 uid/属主敏感
    # (M20 根因),升级 runner 要当成一次显式变更来验,不让它随 latest 静默漂移
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"  # 与 ruff target、docker 镜像对齐(R2 整改:版本三面分裂)
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Verify Docker Daemon & Build Executor
        run: |
          docker info || { echo "Docker daemon is required in CI"; exit 1; }
          docker build -t patchpilot-executor:latest -f docker/executor.Dockerfile docker/
          docker image inspect patchpilot-executor:latest > /dev/null || { echo "Executor image build failed"; exit 1; }
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest -q
      - name: Smoke eval (replay, BUG-001..003)
        run: |
          python scripts/gen_bugs.py BUG-001 BUG-002 BUG-003
          for b in BUG-001 BUG-002 BUG-003; do
            python -m app.evals.run_single --bug "$b" --model fake --engine graph --out runs/ci || exit 1
          done
      - name: Upload eval artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eval-runs
          path: |
            runs/ci/**/report.json
            runs/ci/**/trajectory.jsonl
          if-no-files-found: error
