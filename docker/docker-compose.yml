services:
  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    ports:
      # 仅绑定回环地址:API 无鉴权,不应暴露到局域网
      - "127.0.0.1:8001:8000"
    environment:
      PATCHPILOT_REDIS_URL: redis://redis:6379/0
      PATCHPILOT_DB_PATH: /data/patchpilot.sqlite3
      PATCHPILOT_RUNS_ROOT: /data/runs
    volumes:
      - api-data:/data
      - ../bugs:/app/bugs:ro
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      # 无密码,仅限本机访问
      - "127.0.0.1:6379:6379"
    restart: unless-stopped

volumes:
  api-data:
