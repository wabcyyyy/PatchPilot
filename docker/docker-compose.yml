services:
  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    ports:
      # 仅绑定回环地址:API 无鉴权,不应暴露到局域网;
      # 宿主端口可用 PATCHPILOT_API_HOST_PORT 覆盖(避免与本机其他服务冲突)
      - "${PATCHPILOT_API_HOST_IP:-127.0.0.1}:${PATCHPILOT_API_HOST_PORT:-8001}:8000"
    environment:
      PATCHPILOT_REDIS_URL: redis://redis:6379/0
      PATCHPILOT_DB_PATH: /data/patchpilot.sqlite3
      # docker 后端的关键约束:PATCHPILOT_RUNS_ROOT 必须 = 下方 bind 挂载的 target。
      # API 容器把 runs 下的工作区路径字符串原样传给 docker run -v,
      # 宿主守护进程按"宿主同名路径"解析——两侧路径一致,执行容器才能看到工作区。
      # Windows/Docker Desktop 上 PATCHPILOT_RUNS_ROOT 用守护进程视角路径
      # (/run/desktop/mnt/host/<盘符小写>/...),scripts/compose_smoke.sh 有现成换算。
      PATCHPILOT_RUNS_ROOT: ${PATCHPILOT_RUNS_ROOT:-/data/runs}
      # 测试执行后端:local(默认)由 API 容器内子进程直跑;docker 经下方挂载的
      # 宿主 docker.sock 派发进临时容器(M11 隔离闭环)。切换方式:
      #   docker build -t patchpilot-executor:latest -f docker/executor.Dockerfile docker/
      #   PATCHPILOT_EXECUTION_BACKEND=docker PATCHPILOT_DOCKER_IMAGE=patchpilot-executor:latest \
      #     PATCHPILOT_RUNS_HOST_DIR=<宿主runs目录> PATCHPILOT_RUNS_ROOT=<同路径> \
      #     docker compose up -d --build
      PATCHPILOT_EXECUTION_BACKEND: ${PATCHPILOT_EXECUTION_BACKEND:-local}
      PATCHPILOT_DOCKER_IMAGE: ${PATCHPILOT_DOCKER_IMAGE:-python:3.11-slim}
      PATCHPILOT_TRUSTED_DOCKER_IMAGES: ${PATCHPILOT_TRUSTED_DOCKER_IMAGES:-python:3.11-slim,patchpilot-executor:latest}
      PATCHPILOT_DEPLOYMENT_MODE: ${PATCHPILOT_DEPLOYMENT_MODE:-development}
      # 可选 API 鉴权(.env 同目录生效):非回环部署必须开启
      # 生成:python -c "import secrets; print(secrets.token_urlsafe(32))"
      PATCHPILOT_API_TOKEN: ${PATCHPILOT_API_TOKEN:-}
      # 可选 repo_path 根白名单(见 docs/threat-model.md R1)
      PATCHPILOT_ALLOWED_REPO_ROOTS: ${PATCHPILOT_ALLOWED_REPO_ROOTS:-/data/runs}
      PATCHPILOT_WORKER_ENABLED: "false"
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    volumes:
      - api-data:/data
      - ../bugs:/app/bugs:ro
      # runs 目录 bind 挂载
      - type: bind
        source: ${PATCHPILOT_RUNS_HOST_DIR:-./data/runs}
        target: ${PATCHPILOT_RUNS_ROOT:-/data/runs}
      # P11-3: API 容器无 docker.sock 挂载，不执行目标代码
    depends_on:
      - redis
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    command: ["python", "-m", "app.worker.worker"]
    environment:
      PATCHPILOT_REDIS_URL: redis://redis:6379/0
      PATCHPILOT_DB_PATH: /data/patchpilot.sqlite3
      PATCHPILOT_RUNS_ROOT: ${PATCHPILOT_RUNS_ROOT:-/data/runs}
      PATCHPILOT_EXECUTION_BACKEND: docker
      PATCHPILOT_DOCKER_IMAGE: ${PATCHPILOT_DOCKER_IMAGE:-python:3.11-slim}
      PATCHPILOT_TRUSTED_DOCKER_IMAGES: ${PATCHPILOT_TRUSTED_DOCKER_IMAGES:-python:3.11-slim,patchpilot-executor:latest}
      PATCHPILOT_DEPLOYMENT_MODE: ${PATCHPILOT_DEPLOYMENT_MODE:-production}
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    volumes:
      - api-data:/data
      - ../bugs:/app/bugs:ro
      - type: bind
        source: ${PATCHPILOT_RUNS_HOST_DIR:-./data/runs}
        target: ${PATCHPILOT_RUNS_ROOT:-/data/runs}
      # P11-3: Worker 持有宿主 docker.sock 派发执行容器
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - redis
      - api
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  api-data:
